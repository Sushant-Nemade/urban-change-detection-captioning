name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU development dependencies
        run: |
          python -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[demo,api,augmentation,dev]'
      - name: Test portable workflows
        run: python -m pytest -m 'not integration'
        env:
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
      - name: Check formatting and imports
        run: |
          ruff check src tests apps scripts tools
          ruff format --check src tests apps scripts tools
      - name: Verify split-family provenance and directional evaluation reports
        run: |
          python tools/audit_split_provenance.py --check
          python tools/evaluate_directional_consistency.py --check
      - name: Check release source tree
        run: python scripts/check_release.py
      - name: Build distributions
        run: python -m build
