[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "urban-change-detection-captioning"
version = "0.1.0"
description = "Urban change detection and change captioning with temporal reversal augmentation"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
authors = [{ name = "Sushant Nemade" }]
dependencies = [
  "torch==2.14.1",
  "torchvision==0.29.1",
  "numpy>=1.26.3,<2",
  "pillow>=12.3,<13",
  "opencv-python-headless==4.10.0.84",
  "timm==1.0.12",
  "einops==0.8.0",
  "huggingface-hub>=0.26.5,<1",
  "tqdm>=4.65,<5",
]

[project.optional-dependencies]
demo = ["streamlit==1.66.0"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1"]
augmentation = ["openai>=1.91,<2", "python-dotenv>=1.1,<2"]
dev = ["pytest>=9.1.1,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.scripts]
urban-change = "urban_change.cli:main"

[project.urls]
Repository = "https://github.com/Sushant-Nemade/urban-change-detection-captioning"
Model = "https://huggingface.co/sushantnemade/MCI_augmented"
Dataset = "https://huggingface.co/datasets/sushantnemade/LEVIR-MCI-augmented"

[tool.hatch.build.targets.wheel]
packages = ["src/urban_change"]

[tool.hatch.build.targets.wheel.force-include]
"third_party/licenses" = "urban_change/third_party/licenses"
"THIRD_PARTY_NOTICES.md" = "urban_change/THIRD_PARTY_NOTICES.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: model/checkpoint regression tests requiring local artifacts"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["src/urban_change/evaluation/_vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
